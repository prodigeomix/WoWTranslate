name: Feature Request
description: Suggest an idea or enhancement for WoWTranslate
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an enhancement to WoWTranslate!

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the problem or limitation you are encountering.
      placeholder: E.g., I often encounter custom abbreviations in Turtle WoW 1.18.1 that aren't in the glossary...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Additional Context or Alternatives
      description: Any alternative solutions or features you've considered.
    validations:
      required: false
