name: Build & Release Addon Asset

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v3.5.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Package & Publish Release Asset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Python Proxy Syntax
        run: |
          python -m py_compile wow_proxy.py

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            VERSION="${{ github.event.inputs.tag_name }}"
          elif [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="v$(grep -o '## Version: [0-9.]*' WoWTranslate.toc | awk '{print $2}' || echo 'latest')"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Building package for version: ${VERSION}"

      - name: Package WoWTranslate Addon ZIP
        run: |
          mkdir -p build_stage/WoWTranslate
          mkdir -p build_stage/WoWTranslate/IPC/requests
          mkdir -p build_stage/WoWTranslate/IPC/results
          touch build_stage/WoWTranslate/IPC/requests/.gitkeep
          touch build_stage/WoWTranslate/IPC/results/.gitkeep

          # Copy core addon files
          cp -v WoWTranslate.toc build_stage/WoWTranslate/
          cp -v WoWTranslate*.lua build_stage/WoWTranslate/
          cp -v wow_proxy.py build_stage/WoWTranslate/
          cp -v start_proxy.bat build_stage/WoWTranslate/
          cp -v config.toml build_stage/WoWTranslate/
          cp -v README.md build_stage/WoWTranslate/
          cp -v CHANGELOG.md build_stage/WoWTranslate/
          cp -v LICENSE build_stage/WoWTranslate/

          # Create distribution zip files
          cd build_stage
          zip -r "../WoWTranslate-${{ env.VERSION }}.zip" WoWTranslate
          zip -r "../WoWTranslate.zip" WoWTranslate
          cd ..

          # Generate SHA256 Checksums
          sha256sum "WoWTranslate-${{ env.VERSION }}.zip" "WoWTranslate.zip" > checksums.sha256

      - name: Create / Update GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.VERSION }}
          name: WoWTranslate ${{ env.VERSION }}
          files: |
            WoWTranslate-${{ env.VERSION }}.zip
            WoWTranslate.zip
            checksums.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
