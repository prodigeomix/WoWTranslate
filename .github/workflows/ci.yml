name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Forensic Audit & Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Lua 5.0 / Luac Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          # Create luac symlink if needed
          if command -v luac5.1 &> /dev/null; then
            sudo ln -sf $(which luac5.1) /usr/local/bin/luac
          fi

      - name: Run Lua 5.0 Strict Compliance Validator
        run: python tools/validate_lua50.py

      - name: Run Static Analysis & TOC Order Linter
        run: python tools/check_lua.py

      - name: Run Core Unit Test Suite
        run: python tools/test_wowtranslate.py

      - name: Run Full Forensic Audit Verification Suite
        run: python tools/run_audit_checks.py

      - name: Display Installation Instructions & Prerequisites in Job Summary
        if: matrix.python-version == '3.12'
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # 🌐 WoWTranslate Installation Instructions & Prerequisites

          ### 📌 Prerequisites & Client Requirements
          1. **World of Warcraft 1.12.1 Client** (Vanilla or Turtle WoW 1.18.1).
          2. ⚠️ **SuperWoW (Client File I/O Transport — Required)**:
             - Blizzard 1.12.1 sandboxes Lua (\`io.open\` is disabled). SuperWoW injects \`ExportFile\`/\`ImportFile\` hooks so the addon can communicate with \`wow_proxy.py\`.
             - **Turtle WoW:** SuperWoW is supported natively. Make sure SuperWoW is enabled in your Turtle WoW launcher/directory.
             - **Vanilla 1.12.1:** Download and install [SuperWoW](https://github.com/balakethelock/SuperWoW) into your World of Warcraft directory. *(Alternatively, UnitXP SP3 is also supported).*
          3. **Python 3.10+** (Required to run the local background proxy \`start_proxy.bat\`).
          4. **Ollama** (Recommended offline AI translation engine: \`ollama pull qwen2.5:3b\`).

          ### 🚀 Quick Start Setup
          1. Extract the \`WoWTranslate\` folder into \`World of Warcraft\\Interface\\AddOns\\\`.
          2. Double-click \`start_proxy.bat\` inside \`Interface\\AddOns\\WoWTranslate\\\`.
          3. Launch World of Warcraft (with SuperWoW active) and type \`/wt diag\` to verify the connection (\`Active Transport: SuperWoW File IPC (Proxy)\`).

          Full documentation & troubleshooting: [README.md](https://github.com/prodigeomix/WoWTranslate/blob/main/README.md)
          EOF
