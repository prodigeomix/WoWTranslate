# WoWTranslate Proxy Configuration
# ==================================
# Port and runtime settings
http_port = 7654
workers = 4
cache_db = "translations.db"
stale_ttl = 60
scan_interval = 0.05

# ---------------------------------------------------------------------------
# Translation Backend (Google AI Studio / Gemini API ONLY)
# ---------------------------------------------------------------------------

[[backends]]
type = "gemini"
api_key = "YOUR_GEMINI_API_KEY_HERE"
model = "gemini-2.5-flash"
timeout = 10