# WoWTranslate Proxy Configuration
# ==================================
# Port and runtime settings
http_port = 7654
workers = 4
cache_db = "translations.db"
stale_ttl = 60
scan_interval = 0.05

# ---------------------------------------------------------------------------
# Translation Backends (Evaluated in order of priority)
# ---------------------------------------------------------------------------

# 1. Ollama (100% Local & Offline LLM - Zero API Cost)
# Setup:
#   1. Download and run Ollama from https://ollama.com
#   2. In your terminal, run ONE of the following:
#        ollama pull qwen2.5:3b     (Recommended Default - 2.0GB, fast & low VRAM while gaming)
#        ollama pull qwen2.5:1.5b   (Ultra-fast for laptops & older PCs)
#        ollama pull qwen2.5:7b     (High accuracy - 8GB+ GPU VRAM)
#   3. Make sure the 'model' line below matches the exact name from 'ollama list':
[[backends]]
type = "ollama"
url = "http://localhost:11434"
model = "qwen2.5:3b"
timeout = 20
temperature = 0.0
num_predict = 128
keep_alive = "1h"

# 2. Built-in Google Web Translate (Automatic fallback if Ollama is not running)
[[backends]]
type = "google"
timeout = 8

